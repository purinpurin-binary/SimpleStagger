; SimpleStagger.ini
; Place this file at: Data/SKSE/Plugins/SimpleStagger.ini
; If this file is absent the plugin will write it with these defaults on first run.

[General]

; Enable stagger on melee (non-projectile) weapon hits.
; true = enabled, false = disabled
EnableMelee=true

; Enable stagger on ranged (projectile) weapon hits.
; true = enabled, false = disabled
EnableRanged=true

; Allow the player character to receive stagger.
; Set to false to make the player immune to SimpleStagger staggers.
PlayerCanBeStaggered=true

; Minimum time in milliseconds that must elapse before the same target can be staggered again.
; 0 = no cooldown (every hit may stagger).
StaggerCooldownMs=0

[Stagger]

; Base stagger magnitude for a normal weapon hit.
; Vanilla ranges roughly 0.0 (none) to 1.0 (full knockback).
StaggerMagnitude=0.25

; Stagger magnitude for power attack hits.
PowerAttackMagnitude=0.4

; Stagger magnitude for bash hits.
BashMagnitude=0.25

; What happens when a hit is blocked:
;   0 = no stagger applied on blocked hits
;   1 = stagger applied, but magnitude is multiplied by BlockedMultiplier
BlockedHitBehavior=0

; Magnitude multiplier applied when a hit is blocked (only when BlockedHitBehavior=1).
BlockedMultiplier=0.5

[LargeActor]

; Actors whose (kMass ActorValue * scale) is >= this threshold are considered "large".
; Vanilla race masses: human ~1.0, giant ~8.0, dragon ~10.0+.
; Default 4.0 captures giants and most large creatures while leaving humanoids unaffected.
MassThreshold=4.0

; How large actors are handled:
;   0 = never stagger large actors
;   1 = stagger large actors but multiply magnitude by LargeActorMultiplier
LargeActorMode=0

; Magnitude multiplier applied to large actors (only when LargeActorMode=1).
LargeActorMultiplier=0.5

[Overrides]

; Comma-separated list of entries that are ALWAYS immune to SimpleStagger (never staggered).
; Each entry is either:
;   A Race FormID:   0xABCD~Plugin.esp   (local FormID ~ defining plugin filename)
;   A keyword EditorID string (e.g. ActorTypeDragon)
; Example: Immune=0x13745~Skyrim.esm,ActorTypeGhost
Immune=

; Comma-separated list of entries that are ALWAYS susceptible to SimpleStagger
; regardless of their mass (bypasses the LargeActor mass check).
; Same format as Immune above.
; Example: Susceptible=0x0001A6A6~Skyrim.esm
Susceptible=
