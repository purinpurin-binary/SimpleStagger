; SimpleStagger v1.4.1
; Install as: Data/SKSE/Plugins/SimpleStagger.ini
; The plugin creates this file with the same defaults when it is missing.

[General]

; Melee means TESObjectWEAP::IsMelee(). Staff uses the magic path instead.
; Other unclassified weapons are excluded.
EnableMelee=true

; Ranged means a weapon Form whose type is Bow or Crossbow.
; Bound Bow and mod-added bows use this switch and never fall back to EnableMelee.
EnableRanged=true

; Magic stagger is limited to hostile or detrimental Destruction effects emitted
; as an aimed projectile or concentration beam by a normal Spell, staff, or Scroll.
; Dragon Breath and Other Creature Attacks have independent switches below.
EnableMagic=false

; Concentration beams (Flames, Frostbite, Sparks, concentration staffs, etc.)
; under EnableMagic. false keeps only aimed projectiles. Cloak spells are always
; excluded. Dragon/creature breath streams use their own switches below.
EnableConcentrationMagic=false

; Dragon fire/frost concentration breath and fire/frost ball projectiles.
; Drain Vitality and sources with an unconditional native Stagger effect remain
; excluded. Conditional effects such as the Impact perk do not exclude a spell.
EnableDragonBreath=false

; Dwarven Centurion steam, Forgemaster fire breath/fireballs, and Afflicted poison
; spray. Structurally equivalent mod-added Voice concentration attacks are included.
EnableOtherCreatureAttacks=false

; Controls only stagger events generated by SimpleStagger.
; Vanilla and other mods remain unaffected.
PlayerCanBeStaggered=true

; false = only the player's attacks cause SimpleStagger. NPC, follower, summon,
; dragon and creature attacks are all ignored. Vanilla stagger is unaffected.
NPCsCanStagger=true

; Per-target weapon cooldown in milliseconds. 0 disables it.
StaggerCooldownMs=0

; Per-target interval between magic stagger attempts. Concentration beams remain
; eligible at this interval while continuously hitting. Final resistance/perk
; rejection also starts the interval; transient state failures do not.
MagicCooldownMs=200

[Stagger]

; Apply BlockedHitBehavior to successful physical shield or weapon blocks.
; false treats a physical block like an ordinary hit.
EnablePhysicalBlockBehavior=true

; Apply BlockedHitBehavior to magic absorbed by an active Ward.
; false treats a Ward-absorbed hit like an ordinary hit.
EnableWardBlockBehavior=true

; 0 = no SimpleStagger on successfully guarded hits
; 1 = stagger with BlockedMultiplier applied
BlockedHitBehavior=0
BlockedMultiplier=0.5

; Base magnitude for normal weapon attacks.
; "Maginitude" is the intentional v1.3.0 public key spelling.
NormalAttackMaginitude=0.25

PowerAttackMagnitude=0.4
BashMagnitude=0.25

; Destruction spell/staff/scroll magnitude selected from the eligible effect's
; MinimumSkill.
NoviceMagicMagnitude=0.10
ApprenticeMagicMagnitude=0.15
AdeptMagicMagnitude=0.25
ExpertMagicMagnitude=0.35
MasterMagicMagnitude=0.50

; Shared magnitude for dragon breath/projectiles and selected creature attacks.
BreathAttackMagnitude=0.25

[LargeActor]

; Actors whose Mass ActorValue * scale is at least this value count as large.
MassThreshold=4.0

; 0 = large actors never stagger
; 1 = apply LargeActorMultiplier
LargeActorMode=0
LargeActorMultiplier=0.5

[Overrides]

; Comma-separated Race FormIDs (0xABCD~Plugin.esp) or keyword EditorIDs.
; Immune always blocks SimpleStagger.
Immune=

; Susceptible bypasses only the large-actor check.
Susceptible=
